name: Compilar app de Android (Azuay en Marcha)

# Genera el proyecto Android (Trusted Web Activity) y compila el .aab firmado para Play.
# Cambio clave frente a la v1.1.0: la app se abre siempre en Chrome si está instalado,
# así las notificaciones salen a nombre de "Azuay en Marcha" (delegación de notificaciones).
# Secretos requeridos: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (mayor que el anterior; la 1.1.0 es 2)"
        required: true
        default: "3"
      version_name:
        description: "versionName"
        required: true
        default: "1.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PKG: com.xdcuenca.seguridadenmarcha
      HOST: seguridad-en-marcha-azuay.netlify.app
      KEY_ALIAS: seguridadenmarcha
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # El runner de GitHub ya trae el Android SDK (ANDROID_HOME); setup-android fallaba en sdkmanager
      - name: Aceptar licencias del Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generar proyecto Android
        run: |
          set -e
          mkdir -p proyecto && cd proyecto
          J=app/src/main/java/com/xdcuenca/seguridadenmarcha
          R=app/src/main/res
          mkdir -p $J $R/values $R/mipmap-xxxhdpi $R/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'AzuayEnMarcha'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.11.1' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PKG'
              compileSdk 36
              defaultConfig {
                  applicationId '$PKG'
                  minSdk 24
                  targetSdk 36
                  versionCode ${{ github.event.inputs.version_code }}
                  versionName '${{ github.event.inputs.version_name }}'
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv('KS_PATH'))
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASS')
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/appName"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar"
                  android:manageSpaceActivity="com.google.androidbrowserhelper.trusted.ManageDataLauncherActivity">
                  <meta-data android:name="asset_statements" android:resource="@string/assetStatements" />
                  <meta-data android:name="web_manifest_url" android:value="https://$HOST/manifest.webmanifest" />
                  <meta-data android:name="twa_generator" android:value="azuay-en-marcha-gha" />
                  <activity android:name="com.google.androidbrowserhelper.trusted.ManageDataLauncherActivity" android:exported="false">
                      <meta-data android:name="android.support.customtabs.trusted.MANAGE_SPACE_URL" android:value="https://$HOST/" />
                  </activity>
                  <activity
                      android:name=".LauncherActivity"
                      android:alwaysRetainTaskState="true"
                      android:label="@string/launcherName"
                      android:exported="true">
                      <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL" android:value="https://$HOST/" />
                      <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR" android:resource="@color/colorPrimary" />
                      <meta-data android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR" android:resource="@color/navigationColor" />
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_IMAGE_DRAWABLE" android:resource="@drawable/splash" />
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_BACKGROUND_COLOR" android:resource="@color/backgroundColor" />
                      <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_FADE_OUT_DURATION" android:value="300" />
                      <meta-data android:name="android.support.customtabs.trusted.SCREEN_ORIENTATION" android:value="portrait" />
                      <meta-data android:name="android.support.customtabs.trusted.FALLBACK_STRATEGY" android:value="customtabs" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="$HOST" />
                      </intent-filter>
                  </activity>
                  <activity android:name="com.google.androidbrowserhelper.trusted.FocusActivity" />
                  <activity android:name="com.google.androidbrowserhelper.trusted.WebViewFallbackActivity" android:configChanges="orientation|screenSize" />
                  <service
                      android:name=".DelegationService"
                      android:enabled="true"
                      android:exported="true">
                      <meta-data android:name="android.support.customtabs.trusted.SMALL_ICON" android:resource="@drawable/ic_notification_icon" />
                      <intent-filter>
                          <action android:name="android.support.customtabs.trusted.TRUSTED_WEB_ACTIVITY_SERVICE" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </service>
                  <activity android:name="com.google.androidbrowserhelper.trusted.NotificationPermissionRequestActivity" />
              </application>
          </manifest>
          EOF

          cat > $J/LauncherActivity.java <<'EOF'
          package com.xdcuenca.seguridadenmarcha;

          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import com.google.androidbrowserhelper.trusted.SessionStore;
          import com.google.androidbrowserhelper.trusted.SharedPreferencesTokenStore;
          import com.google.androidbrowserhelper.trusted.TwaLauncher;

          // Abre la app en Chrome si está instalado (aunque el navegador predeterminado sea otro, p. ej.
          // Samsung Internet): Chrome delega las notificaciones a esta app y salen como "Azuay en Marcha".
          public class LauncherActivity extends com.google.androidbrowserhelper.trusted.LauncherActivity {
              private static final String CHROME = "com.android.chrome";

              @Override
              protected TwaLauncher createTwaLauncher() {
                  if (chromeDisponible()) {
                      return new TwaLauncher(this, CHROME, SessionStore.makeSessionId(getTaskId()),
                              new SharedPreferencesTokenStore(this), null);
                  }
                  return super.createTwaLauncher();
              }

              private boolean chromeDisponible() {
                  try {
                      ApplicationInfo info = getPackageManager().getApplicationInfo(CHROME, 0);
                      return info.enabled;
                  } catch (PackageManager.NameNotFoundException e) {
                      return false;
                  }
              }
          }
          EOF

          cat > $J/DelegationService.java <<'EOF'
          package com.xdcuenca.seguridadenmarcha;

          public class DelegationService extends com.google.androidbrowserhelper.trusted.DelegationService {
              @Override
              public void onCreate() {
                  super.onCreate();
              }
          }
          EOF

          cat > $R/values/strings.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="appName">Azuay en Marcha</string>
              <string name="launcherName">Azuay en Marcha</string>
              <string name="assetStatements">[{ \"relation\": [\"delegate_permission/common.handle_all_urls\"], \"target\": { \"namespace\": \"web\", \"site\": \"https://$HOST\" } }]</string>
          </resources>
          EOF

          cat > $R/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#FFFFFF</color>
              <color name="navigationColor">#FFFFFF</color>
              <color name="backgroundColor">#FFFFFF</color>
          </resources>
          EOF

          cat > $R/drawable/ic_notification_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,1L3,5v6c0,5.55 3.84,10.74 9,12c5.16,-1.26 9,-6.45 9,-12V5L12,1z" />
          </vector>
          EOF

          curl -fsSL "https://$HOST/icon-512.png" -o $R/mipmap-xxxhdpi/ic_launcher.png
          cp $R/mipmap-xxxhdpi/ic_launcher.png $R/drawable/splash.png
          find . -type f | sort

      - name: Preparar llave de firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          echo "KS_PATH=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"
          echo "Huella SHA-256 de la llave (compárala con Play Console → Integridad de la app → certificado de subida):"
          keytool -list -v -keystore "$RUNNER_TEMP/signing.keystore" -alias "$KEY_ALIAS" -storepass "$KS_PASS" | grep -E "SHA256|SHA-256"

      - name: Compilar .aab y .apk firmados
        working-directory: proyecto
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: azuay-en-marcha-${{ github.event.inputs.version_name }}
          path: |
            proyecto/app/build/outputs/bundle/release/*.aab
            proyecto/app/build/outputs/apk/release/*.apk
